<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>TRIVOX — Força e Aeróbico</title>
  <meta name="description" content="TRIVOX — Monte fichas de musculação e prescreva treino aeróbico por zonas de frequência cardíaca.">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4C5FBE">
  <link rel="icon" href="icons/icone-192.png">

  <!-- iOS: instalar pela tela de compartilhar do Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRIVOX">
  <link rel="apple-touch-icon" href="icons/icone-192.png">

  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main id="app">
    <div class="carregando-marca">
      <img src="icons/icone-192.png" alt="" width="64" height="64">
      <div class="carregando-nome">TRIVOX</div>
      <p class="apagado centro">Carregando...</p>
    </div>
  </main>

  <nav class="nav" id="nav"></nav>

  <script src="js/dados.js"></script>
  <script src="js/forca.js"></script>
  <script src="js/aerobico.js"></script>
  <script src="js/gamificacao.js"></script>
  <script src="js/pictogramas.js"></script>
  <script src="js/spotify.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/videos.js"></script>
  <!-- Unica dependencia externa do projeto: SDK oficial do Supabase, so pra login/sincronizacao
       na nuvem (ver js/nuvem.js). Cacheada pelo sw.js pra continuar funcionando offline depois
       do primeiro carregamento — se falhar (ex.: 1o uso sem internet), o app inteiro continua
       funcionando normal, so a nuvem fica indisponivel ate a proxima vez online. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/nuvem.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
